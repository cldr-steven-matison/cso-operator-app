apiVersion: apps/v1
kind: Deployment
metadata:
  name: cso-operator-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cso-operator-app
  template:
    metadata:
      labels:
        app: cso-operator-app
    spec:
      serviceAccountName: cso-operator-app
      containers:
        - name: app
          image: cso-operator-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cso-operator-app-config
          env:
            # mTLS to the userCertAuth prod NiFi (BrainShare files/cso-prod-1/user-cso-operator-app.yaml
            # mints the cert + declares the NiFi User). Unset on a singleUserAuth cluster.
            - name: NIFI_CLIENT_CERT
              value: /etc/nifi-client/tls.crt
            - name: NIFI_CLIENT_KEY
              value: /etc/nifi-client/tls.key
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              # Headroom for the vLLM/NiFi/Kafka/EFM admin calls. The clip/gif
              # ffmpeg fork that needed 3Gi/3cpu was removed with the Streamers
              # module (#385) — trim these if the Operator/RAG/EFM app never does.
              cpu: "3"
              memory: "3Gi"
          volumeMounts:
            - name: nifi-client-cert
              mountPath: /etc/nifi-client
              readOnly: true
      volumes:
        - name: nifi-client-cert
          secret:
            secretName: cso-operator-app-cert
            optional: true
