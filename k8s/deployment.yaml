apiVersion: apps/v1
kind: Deployment
metadata:
  name: cso-operator-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cso-operator-app
  template:
    metadata:
      labels:
        app: cso-operator-app
    spec:
      serviceAccountName: cso-operator-app
      containers:
        - name: app
          image: cso-operator-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cso-operator-app-config
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              # The clip/gif fork runs its ffmpeg burns under separate locks, so
              # up to three ffmpeg processes are in flight at once (~800Mi) on top
              # of the app and the OpenCV facecam model. 1Gi/1cpu OOM-looped.
              cpu: "3"
              memory: "3Gi"
          volumeMounts:
            - name: clips-storage
              mountPath: /clips
      volumes:
        - name: clips-storage
          persistentVolumeClaim:
            claimName: clips-storage
