---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: new-clips
  namespace: cld-streaming
  labels:
    strimzi.io/cluster: my-cluster
spec:
  topicName: new_clips
  partitions: 3
  replicas: 3
  config:
    retention.ms: "604800000"   # 7 days
    cleanup.policy: delete
    min.insync.replicas: "2"
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: processed-clips
  namespace: cld-streaming
  labels:
    strimzi.io/cluster: my-cluster
spec:
  topicName: processed_clips
  partitions: 3
  replicas: 3
  config:
    retention.ms: "604800000"   # 7 days
    cleanup.policy: delete
    min.insync.replicas: "2"
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: twitch-chat-activity
  namespace: cld-streaming
  labels:
    strimzi.io/cluster: my-cluster
spec:
  topicName: twitch_chat_activity
  partitions: 3
  replicas: 3
  config:
    retention.ms: "259200000"   # 3 days
    cleanup.policy: delete
    min.insync.replicas: "2"
---
# The gif half of the ProcessClips fork (#195). Transport only — the permanent
# gif library is .gif_index.json on the /clips PVC, because a 7-day retention
# would age the archive out.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: processed-gifs
  namespace: cld-streaming
  labels:
    strimzi.io/cluster: my-cluster
spec:
  topicName: processed_gifs
  partitions: 3
  replicas: 3
  config:
    retention.ms: "604800000"   # 7 days
    cleanup.policy: delete
    min.insync.replicas: "2"
